# 个人版双端构建（未签名 / 未公证）
#
# 与上游 release-desktop.yml 的区别：
#   · 不依赖上游的 R2 存储与 updates.beefapi.com，只写**本仓库**的 GitHub Release
#   · 自动更新走本仓库 Releases：
#       feed 地址 https://github.com/<owner>/<repo>/releases/latest/download/desktop-update.json
#       资材地址 https://github.com/<owner>/<repo>/releases/download/<版本>/<文件名>
#     签名用本仓库的 secret BEEFTV_UPDATER_PRIVATE_KEY + variable BEEFTV_UPDATER_PUBLIC_KEY
#   · 产物本身仍未签名 / 未公证：macOS 首次打开需右键「打开」，Windows 会提示未知发布者
#
# 触发方式：推送 v* 标签，或在 Actions 页面手动触发

name: Personal build (unsigned)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: personal-build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  # 桌面端的自动更新源：本仓库的最新 Release 里的 desktop-update.json
  BEEFTV_UPDATER_FEED_URL: https://github.com/${{ github.repository }}/releases/latest/download/desktop-update.json
  # feed 里每个平台资材的下载前缀（代码会拼成 <base>/<版本>/<文件名>）
  UPDATER_DOWNLOAD_BASE: https://github.com/${{ github.repository }}/releases/download

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: darwin-arm64
            wails_platform: darwin/arm64
          - os: macos-15-intel
            platform: darwin-amd64
            wails_platform: darwin/amd64
          - os: windows-2022
            platform: windows-amd64
            wails_platform: windows/amd64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Install MSYS2 UCRT64 GCC
        id: msys2
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          release: true
          path-type: inherit
          install: mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-binutils

      - name: Assert DWARF 5 CGO compiler
        if: runner.os == 'Windows'
        env:
          MSYSTEM_PREFIX: ${{ steps.msys2.outputs.msys2-location }}\ucrt64
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\assert-windows-dwarf5-cgo.ps1

      - name: Build official plugin packages
        if: runner.os != 'Windows'
        run: sh plugin-packages/build-packages.sh

      - name: Build macOS desktop
        if: runner.os != 'Windows'
        env:
          BEEFTV_SKIP_LOCAL_VERIFY: "1"
          BEEFTV_WAILS_PLATFORM: ${{ matrix.wails_platform }}
          BEEFTV_UPDATER_PUBLIC_KEY: ${{ vars.BEEFTV_UPDATER_PUBLIC_KEY }}
        run: ./scripts/build-beeftv-release.sh

      - name: Build Windows desktop
        if: runner.os == 'Windows'
        env:
          CGO_ENABLED: "1"
          BEEFTV_UPDATER_PUBLIC_KEY: ${{ vars.BEEFTV_UPDATER_PUBLIC_KEY }}
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\build-beeftv-windows-release.ps1

      - name: Package release zip
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          mkdir -p dist
          input="cmd/desktop/build/bin"
          if [[ "$PLATFORM" == darwin-* ]]; then
            input="$input/BeefTV.app"
          fi
          ( cd backend && go run ./cmd/update-release package \
              --platform "$PLATFORM" \
              --input "$input" \
              --output "../dist/BeefTV-${VERSION}-${PLATFORM}.zip" )
          ls -lh "dist/BeefTV-${VERSION}-${PLATFORM}.zip"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}
          path: dist/*.zip
          if-no-files-found: error

  release:
    name: Sign feed and publish Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Retrieve all platform builds
        uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          merge-multiple: true
          path: dist

      - name: Verify updater credentials are configured
        env:
          BEEFTV_UPDATER_PUBLIC_KEY: ${{ vars.BEEFTV_UPDATER_PUBLIC_KEY }}
          BEEFTV_UPDATER_PRIVATE_KEY: ${{ secrets.BEEFTV_UPDATER_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "$BEEFTV_UPDATER_PUBLIC_KEY" || -z "$BEEFTV_UPDATER_PRIVATE_KEY" ]]; then
            echo "::error::缺少 BEEFTV_UPDATER_PUBLIC_KEY (variable) 或 BEEFTV_UPDATER_PRIVATE_KEY (secret)，无法签发自更新 feed。"
            exit 1
          fi

      - name: Sign desktop-update.json
        working-directory: backend
        env:
          BEEFTV_UPDATER_PUBLIC_KEY: ${{ vars.BEEFTV_UPDATER_PUBLIC_KEY }}
          BEEFTV_UPDATER_PRIVATE_KEY: ${{ secrets.BEEFTV_UPDATER_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < ../VERSION)"
          echo "VERSION=$VERSION"
          ls -lh ../dist
          go run ./cmd/update-release sign \
            --version "$VERSION" \
            --commit "${{ github.sha }}" \
            --changelog ../CHANGELOG.md \
            --download-base "$UPDATER_DOWNLOAD_BASE" \
            --expect-public-key "$BEEFTV_UPDATER_PUBLIC_KEY" \
            --require-platforms darwin-arm64,darwin-amd64,windows-amd64 \
            --asset "darwin-arm64=../dist/BeefTV-${VERSION}-darwin-arm64.zip" \
            --asset "darwin-amd64=../dist/BeefTV-${VERSION}-darwin-amd64.zip" \
            --asset "windows-amd64=../dist/BeefTV-${VERSION}-windows-amd64.zip" \
            --output "../dist/desktop-update.json"
          go run ./cmd/update-release verify \
            --envelope "../dist/desktop-update.json" \
            --public-key-text "$BEEFTV_UPDATER_PUBLIC_KEY"
          echo "--- feed 内容 ---"
          cat ../dist/desktop-update.json

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          TAG="${{ github.ref_name }}"
          if [[ "$TAG" != v* ]]; then
            echo "手动触发，使用 VERSION 作为标签：$VERSION"
            TAG="$VERSION"
          fi
          notes_file="$RUNNER_TEMP/notes.md"
          cat > "$notes_file" <<EOF
          ## 个人构建（未签名 / 未公证）

          - 版本：$VERSION
          - 提交：${{ github.sha }}
          - 产物为**未签名 / 未公证**构建：macOS 首次打开需右键 →「打开」放行；Windows 会提示「未知发布者」。

          ### 自动更新

          桌面端内置的更新源已指向本仓库：
          \`https://github.com/${{ github.repository }}/releases/latest/download/desktop-update.json\`。
          安装本版本后，后续版本可直接在应用内检查更新。
          EOF
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.zip dist/desktop-update.json --clobber
            gh release edit "$TAG" --notes-file "$notes_file" --latest --draft=false
          else
            gh release create "$TAG" dist/*.zip dist/desktop-update.json \
              --title "BeefTV $VERSION（个人构建）" \
              --notes-file "$notes_file" \
              --target "${{ github.sha }}" \
              --latest --draft=false
          fi
          # 必须是已发布状态：draft 的 /releases/latest/download/<资产> 不会生效，
          # 桌面端更新器会因此取不到 feed。
          if [[ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" == "true" ]]; then
            echo "::error::Release $TAG 仍是 draft，自动更新 feed 地址将不可用。"
            exit 1
          fi
          gh release view "$TAG" --json url,assets --jq '.url, (.assets[]? | "  \(.name)  \(.size)")'
